name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  FOUNDER_API_KEY_CIPHER_SECRET: placeholder-cipher-secret-16chars
  OPENROUTER_API_KEY: placeholder-openrouter-key
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:unit

      - run: npm run architecture:check

  full:
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: full
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
